name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-tests:
    name: Godot import, script check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_HOME: ${{ github.workspace }}/.cache/godot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/install_godot.sh') }}

      - name: Install pinned Godot
        run: scripts/install_godot.sh

      - name: No keystores, keys or ads_release.json committed
        run: scripts/check_no_secrets.sh

      - name: English only (no Spanish locale, strings or store text)
        run: |
          python3 tools/check_english_only.py --self-test
          python3 tools/check_english_only.py
          python3 tools/roster.py --check   # campaign roster = docs/ART_PROMPTS.md
          python3 tools/check_strings.py    # every UI string key exists

      - name: Verify (import, compile, unit/property tests, JUnit gate)
        run: scripts/verify_all.sh

      - name: Line coverage (instrumented re-run, fails below brief targets)
        run: GODOT="$(scripts/install_godot.sh)" python3 tools/coverage.py build/reports/coverage

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Legend Arrow verification"
            if [ -f build/reports/summary.json ]; then
              echo '```json'; cat build/reports/summary.json; echo '```'
            else
              echo "No test summary produced (an earlier step failed)."
            fi
            if [ -f build/reports/coverage/coverage.md ]; then cat build/reports/coverage/coverage.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/
          if-no-files-found: error

  store-assets:
    name: Play Store assets (names, sizes, format, limits)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check docs/store/play_console
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==12.3.0 numpy==2.5.3
          "$RUNNER_TEMP/venv/bin/python" tools/make_icons.py --check
          "$RUNNER_TEMP/venv/bin/python" -m unittest -v tools/art/test_import_art.py   # art import checks
          "$RUNNER_TEMP/venv/bin/python" tools/store_assets.py check | tee store_assets_check.txt
          cp store_assets_check.txt docs/store/play_console/

      - name: Upload play-store-assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-store-assets
          path: docs/store/play_console/
          if-no-files-found: error

  android-ads-plugin:
    name: Kotlin ads plugin (unit tests, lint, AAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-plugin-${{ hashFiles('android/plugins/legend_ads/**/*.kts', 'android/plugins/legend_ads/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build and test plugin
        run: ANDROID_HOME="$ANDROID_SDK_ROOT" scripts/build_ads_plugin.sh

      - name: Upload AAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legend-ads-aar
          path: addons/legend_ads/bin/legend_ads-release.aar
          if-no-files-found: error

      - name: Upload Kotlin reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-reports
          path: |
            build/reports/kotlin/
            android/plugins/legend_ads/plugin/build/reports/
            android/plugins/legend_ads/plugin/build/test-results/
          if-no-files-found: warn

  android-debug-apk:
    name: Export Android debug APK
    needs: [godot-tests, android-ads-plugin]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_HOME: ${{ github.workspace }}/.cache/godot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/install_godot.sh') }}

      - name: Cache Android export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-android-${{ hashFiles('scripts/export_android.sh') }}

      - name: Get ads plugin AAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: legend-ads-aar
          path: addons/legend_ads/bin

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-export-${{ hashFiles('export_presets.cfg', 'addons/legend_ads/legend_ads_editor.gd') }}

      - name: Export and inspect APK
        run: ANDROID_HOME="$ANDROID_SDK_ROOT" scripts/export_android.sh

      - name: Release AAB rehearsal (throwaway key, ads disabled, bundletool validation)
        run: ANDROID_HOME="$ANDROID_SDK_ROOT" EXPECT_VERSION_CODE=3 scripts/export_release.sh --rehearsal

      - name: Upload release AAB rehearsal (NOT for Play upload)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legend-arrow-release-aab-rehearsal
          path: |
            build/android/legend-arrow-release.aab
            build/android/legend-arrow-release.aab.sha256
            build/android/aab_report.txt
            build/android/universal/apk_report.txt
            build/android/export_release.log
          if-no-files-found: error

      - name: Release AAB rehearsal without ads (path used by release.yml "without-ads")
        run: ANDROID_HOME="$ANDROID_SDK_ROOT" EXPECT_VERSION_CODE=3 scripts/export_release.sh --rehearsal --no-ads

      - name: Upload debug APK (unsigned for release; debug-signed)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legend-arrow-debug-apk
          path: |
            build/android/legend-arrow-debug.apk
            build/android/legend-arrow-debug.apk.sha256
            build/android/apk_report.txt
            build/android/export.log
          if-no-files-found: error

  desktop-e2e:
    name: Desktop E2E journeys (${{ matrix.form }})
    needs: [godot-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: phone
            res: 720x1280
          - form: tablet
            res: 1200x1920
    env:
      GODOT_HOME: ${{ github.workspace }}/.cache/godot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/install_godot.sh') }}

      - name: Cache Xvfb / Mesa / ffmpeg packages
        # The Ubuntu mirror was unreachable from many runners on 2026-11-18/19
        # (runs 44418636509, 44423038351, 44432245604). Once any run installs
        # the packages, their .deb files are cached and later runs install
        # them with dpkg, without the mirror.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/desktop-debs
          key: desktop-debs-${{ runner.os }}-ubuntu-24.04-v1

      - name: Install Xvfb, Mesa and ffmpeg
        id: deps
        timeout-minutes: 12
        run: |
          PKGS="xvfb libgl1-mesa-dri ffmpeg"
          # The journeys need only Xvfb + Mesa's software GL. When the runner
          # image already has both, never touch the (flaky) mirror for them;
          # ffmpeg is only for the gameplay video, which is skipped (and
          # reported) if ffmpeg cannot be installed.
          have_gl() { command -v Xvfb >/dev/null && compgen -G "/usr/lib/x86_64-linux-gnu/dri/*swrast*" >/dev/null; }
          if have_gl; then
            if command -v ffmpeg >/dev/null; then echo "Xvfb, Mesa and ffmpeg already present"; exit 0; fi
            PKGS="ffmpeg"
          fi
          DEBS="$GITHUB_WORKSPACE/.cache/desktop-debs"
          if dpkg -s $PKGS >/dev/null 2>&1; then
            echo "already installed: $PKGS"; exit 0
          fi
          if compgen -G "$DEBS/*.deb" >/dev/null && sudo dpkg -i "$DEBS"/*.deb >/dev/null 2>&1 \
             && dpkg -s $PKGS >/dev/null 2>&1; then
            echo "installed from cached .deb files ($(ls "$DEBS" | wc -l))"; exit 0
          fi
          APT="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          APT="$APT -o APT::Keep-Downloaded-Packages=true -o Binary::apt::APT::Keep-Downloaded-Packages=true"
          ONLY_UBUNTU=""
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            ONLY_UBUNTU="-o Dir::Etc::SourceList=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::SourceParts=-"
          fi
          sudo rm -f /var/cache/apt/archives/*.deb
          install() { timeout 120 sudo apt-get $APT install -y -qq --no-install-recommends $PKGS >/dev/null; }
          keep() { mkdir -p "$DEBS"; cp /var/cache/apt/archives/*.deb "$DEBS"/ 2>/dev/null || true; }
          if install; then keep; exit 0; fi
          for attempt in 1 2; do   # 120 + 2 x (120 + 120 + 10) s fits the 12 min step
            if timeout 120 sudo apt-get $APT $ONLY_UBUNTU update -qq && install; then
              keep; exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 10
          done
          if have_gl; then
            echo "::warning::ffmpeg could not be installed (mirror down); journeys run, the gameplay video is skipped"
            echo "no_ffmpeg=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

      - name: Run journeys
        run: |
          GODOT="$(scripts/install_godot.sh)"
          "$GODOT" --headless --path . --import >/dev/null 2>&1 || true
          GODOT="$GODOT" E2E_RES=${{ matrix.res }} scripts/desktop_e2e.sh build/e2e-desktop-${{ matrix.form }}

      - name: Record gameplay + awakening video (Movie Maker)
        if: matrix.form == 'phone' && steps.deps.outputs.no_ffmpeg != '1'
        run: GODOT="$(scripts/install_godot.sh)" scripts/record_video.sh build/e2e-desktop-${{ matrix.form }}/legend_arrow_gameplay.mp4

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-desktop-${{ matrix.form }}
          path: build/e2e-desktop-${{ matrix.form }}/
          if-no-files-found: error

  android-emulator-e2e:
    name: Android emulator E2E (API ${{ matrix.api }}, ${{ matrix.profile_name }})
    needs: [android-debug-apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:   # v0.2 §9.3: API 26 + P1, API 34 + P3 (cutout), API 36 + P6 (tablet)
          - {api: 26, avd: pixel, profile_name: P1, wm_size: "720x1280", wm_density: "320"}
          - {api: 34, avd: pixel_6, profile_name: P3, wm_size: "", wm_density: ""}
          - {api: 36, avd: pixel_tablet, profile_name: P6, wm_size: "1600x2560", wm_density: "320"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: legend-arrow-debug-apk
          path: build/android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_WM_SIZE: ${{ matrix.wm_size }}
          E2E_WM_DENSITY: ${{ matrix.wm_density }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.avd }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/android_e2e.sh build/android/legend-arrow-debug.apk build/e2e-android && scripts/measure_device.sh build/android/legend-arrow-debug.apk build/e2e-android/measure-emulator

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-android-api${{ matrix.api }}-${{ matrix.profile_name }}
          path: build/e2e-android/
          if-no-files-found: error
